site_name: pyverge
site_description: Schema evolution and migrations for versioned models
repo_url: https://github.com/JoHa-HQ/pyverge

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Home: getting-started.md
  - Concepts: concepts.md
  - Registration: registration.md
  - Model Reflection: reflection.md
  - Execution Flow: execution-flow.md
  - Target Policy: target-policy.md
  - Telemetry & Hooks: telemetry.md
  - Common Usage Patterns: usage.md
  - Scenarios: scenarios.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
