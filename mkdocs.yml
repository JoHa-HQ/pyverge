site_name: pyverge
site_description: Schema evolution and migrations for versioned models
repo_url: https://github.com/JoHa-HQ/pyverge

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Home: getting-started.md
  - Concepts: concepts.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
