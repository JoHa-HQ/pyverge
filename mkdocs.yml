site_name: pyverge
site_description: Schema evolution and migrations for versioned models
repo_url: https://github.com/JoHa-HQ/pyverge

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Getting started: tutorials/getting-started.md
      - Examples:
          - Executable quickstart: examples/quickstart.md
          - Target policies: examples/target-policies.md
          - Async execution: examples/async-runner.md
          - Reconstruct a missing model: examples/reconstruct-missing-model.md
          - Generate a migration from models: examples/generate-migration.md
          - OTel hooks: examples/otel-hooks.md
          - OpenLineage hooks: examples/openlineage-hooks.md
          - CLI: examples/cli.md
          - Benchmark latency: examples/benchmark.md
          - JGF API: examples/jgf-api.md
          - CI manifest comparison: examples/ci-manifest.md
  - How-to:
      - how-to/index.md
      - Models:
          - how-to/models/index.md
          - Register models and migrations: how-to/models/register-models.md
          - Use the manager: how-to/models/use-manager.md
      - Migrations:
          - how-to/migrations/index.md
          - Author migrations: how-to/migrations/author-migrations.md
          - Reconstruct missing models: how-to/migrations/reconstruct-missing-models.md
          - Reconstruct missing migrations: how-to/migrations/reconstruct-missing-migrations.md
          - Use runtime context in migrations: how-to/migrations/migration-context.md
      - Runtime:
          - how-to/runtime/index.md
          - Run payloads: how-to/runtime/run-payloads.md
          - Migrate nested payloads: how-to/runtime/migrate-nested-payloads.md
      - Operations:
          - how-to/operations/index.md
          - Test migrations: how-to/operations/test-migrations.md
          - Instrument migrations with hooks: how-to/operations/instrument-migrations.md
          - Benchmark adapters: how-to/operations/benchmark-adapters.md
  - Integrations:
      - integrations/index.md
      - FastMCP:
          - integrations/fastmcp/index.md
          - How-to: integrations/fastmcp/how-to.md
          - Reference: integrations/fastmcp/reference.md
      - FastStream:
          - integrations/faststream/index.md
          - How-to: integrations/faststream/how-to.md
          - Reference: integrations/faststream/reference.md
  - Reference:
      - reference/index.md
      - API reference: reference/api.md
      - Manager API: reference/manager.md
      - Runtime and execution: reference/runtime.md
      - Migration formats: reference/migration-formats.md
      - Target policy: reference/target-policy.md
      - Compatibility: reference/compatibility.md
      - Upgrade guide: reference/upgrades.md
      - CLI: reference/cli.md
  - Explanation:
      - explanation/index.md
      - Concepts: explanation/concepts.md
      - Glossary: explanation/glossary.md
      - Managers: explanation/managers.md
      - Providers: explanation/providers.md
      - Migration strategies: explanation/migrations.md
      - Migration authoring: explanation/migration-authoring.md
      - Execution flow: explanation/execution-flow.md
      - Scenarios: explanation/scenarios.md
      - Testing approach: explanation/testing.md
      - Benchmarking approach: explanation/benchmarking.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
