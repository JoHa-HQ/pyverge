site_name: pyverge
site_description: Schema evolution and migrations for versioned models
repo_url: https://github.com/JoHa-HQ/pyverge

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Getting started: tutorials/getting-started.md
      - Executable quickstart: examples/quickstart.md
  - How-to:
      - how-to/index.md
      - Register models and migrations: how-to/register-models.md
      - Author migrations: how-to/author-migrations.md
      - Migrate missing models and migrations: how-to/migrations.md
      - Test migrations: how-to/testing.md
      - Telemetry and hooks: how-to/telemetry.md
      - Benchmark adapters: how-to/benchmarking.md
      - Integrations:
          - FastMCP: how-to/integrations/fastmcp.md
          - FastStream: how-to/integrations/faststream.md
  - Reference:
      - reference/index.md
      - API reference: reference/api.md
      - Manager: reference/manager.md
      - Runtime and execution: reference/runtime.md
      - Migration formats: reference/migration-formats.md
      - Target policy: reference/target-policy.md
      - Compatibility: reference/compatibility.md
      - Upgrade guide: reference/upgrades.md
      - CLI: reference/cli.md
      - FastMCP: reference/fastmcp.md
      - FastStream: reference/faststream.md
  - Explanation:
      - explanation/index.md
      - Concepts: explanation/concepts.md
      - Glossary: explanation/glossary.md
      - Managers: explanation/managers.md
      - Providers: explanation/providers.md
      - Migration strategies: explanation/migrations.md
      - Execution flow: explanation/execution-flow.md
      - Scenarios: explanation/scenarios.md
      - FastMCP: explanation/fastmcp.md
      - FastStream: explanation/faststream.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            members_order: source

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
