site_name: pydantic-migrator
site_description: Schema evolution and migrations for Pydantic models
repo_url: https://github.com/joha-hq/pydantic-migrator

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - SDK:
      - Models: sdk/models.md
      - Migrations: sdk/migrations.md
      - Schema Export: sdk/schemas.md
  - CLI: cli.md
  - API Reference: api-reference.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
