site_name: pyverge
site_description: Schema evolution and migrations for versioned models
repo_url: https://github.com/JoHa-HQ/pyverge

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Home: getting-started.md
  - Concepts: concepts.md
  - Managers: managers.md
  - Migrations: migration.md
  - Migration Formats: migration-formats.md
  - Runtime & Execution: runtime.md
  - Execution Flow: execution-flow.md
  - Target Policy: target-policy.md
  - Compatibility: compatibility.md
  - Telemetry & Hooks: telemetry.md
  - CLI Reference: cli.md
  - FastMCP Integration: fastmcp.md
  - FastStream Integration: faststream.md
  - Testing: testing.md
  - Benchmarking: benchmarking.md
  - Common Usage Patterns: usage.md
  - Scenarios: scenarios.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
