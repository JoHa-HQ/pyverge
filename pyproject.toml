[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "toml-sort>=0.24",
  "ty>=0.0.1a5",
  "pre-commit>=4.0",
  "commitizen>=4.16.2",
  "hatch>=1.16.5",
  "hatch-vcs>=0.5.0",
  "syrupy>=5.2.0",
  "pytest-stub>=1.1.0",
  "typing-extensions>=4.15.0"
]

[project]
name = "pyverge"
dynamic = ["version"]
description = "Migration orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic[email,timezone]>=2.11",
  "pydantic-extra-types[phonenumbers]>=2.9",
  "semver>=3.0",
  "pendulum>=3.2.0",
  "opentelemetry-distro[telemetry]>=0.65b0",
  "opentelemetry-exporter-otlp[telemetry]>=1.44.0",
  "jsonpatch>=1.33",
  "jsonschema>=4.26.0",
  "datamodel-code-generator>=0.76.2"
]

[project.optional-dependencies]
cli = [
  "typer>=0.21",
  "rich>=13"
]

[project.scripts]
pyverge = "pyverge.cli.main:app"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
version_schema = "semver"
update_changelog_on_bump = true

[tool.hatch.build.hooks.vcs]
version-file = "src/pyverge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyverge"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pyverge --cov-report=term-missing --cov-fail-under=80 --doctest-modules"

[tool.ruff]
target-version = "py311"
line-length = 88
respect-gitignore = true

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "PL", "RUF", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/pyverge/migration/engine.py" = ["PLR0913", "C901"]
"src/pyverge/migration/executor.py" = ["PLR0913"]
"src/pyverge/migration/strategy.py" = ["PLR0913"]
"src/pyverge/migration/walker.py" = ["C901", "PLR0912", "PLR0913"]
"src/pyverge/migration/types.py" = ["PLR0913"]
"src/pyverge/core/types.py" = ["PLR0913"]
"src/pyverge/reflection/discovery.py" = ["C901", "PLR0912"]
"src/pyverge/adapters/json_schema/adapter.py" = ["PLR0911"]
"tests/utils.py" = ["PLR0913"]
"tests/test_engine.py" = ["PLR0913"]
"tests/test_graph.py" = ["PLR0913"]
"tests/test_version_property.py" = ["PLR0913"]
