[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "toml-sort>=0.24",
  "ty>=0.0.1a5",
  "pre-commit>=4.0",
  "commitizen>=4.16.2",
  "hatch>=1.16.5",
  "uv-dynamic-versioning>=0.14.1",
  "syrupy>=5.2.0",
  "pytest-stub>=1.1.0",
  "typing-extensions>=4.15.0"
]

[project]
name = "pyverge"
dynamic = ["version"]
description = "Migration orchestration framework"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13"
]
dependencies = [
  "pydantic[email,timezone]>=2.11",
  "pydantic-extra-types[phonenumbers]>=2.9",
  "semver>=3.0",
  "pendulum>=3.2.0",
  "opentelemetry-distro[telemetry]>=0.65b0",
  "opentelemetry-exporter-otlp[telemetry]>=1.44.0",
  "jsonpatch>=1.33",
  "jsonschema>=4.26.0",
  "datamodel-code-generator>=0.76.2"
]

[project.optional-dependencies]
cli = [
  "typer>=0.21",
  "rich>=13"
]
fastmcp = [
  "fastmcp>=4",
  "dependency-injector>=4.49.1"
]

[project.scripts]
pyverge = "pyverge.cli.main:app"

[project.urls]
Homepage = "https://github.com/JoHa-HQ/pyverge"
Repository = "https://github.com/JoHa-HQ/pyverge"
Changelog = "https://github.com/JoHa-HQ/pyverge/blob/main/CHANGELOG.md"
Issues = "https://github.com/JoHa-HQ/pyverge/issues"

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
tag_format = "v$version"
version_schema = "semver"
update_changelog_on_bump = true

[tool.hatch.build.hooks.version]
path = "src/pyverge/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pyverge"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pyverge --cov-report=term-missing --cov-fail-under=80 --doctest-modules"

[tool.ruff]
target-version = "py311"
line-length = 88
respect-gitignore = true

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "PL", "RUF", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/pyverge/migration/engine.py" = ["PLR0913", "C901"]
"src/pyverge/migration/executor.py" = ["PLR0913"]
"src/pyverge/migration/strategy.py" = ["PLR0913"]
"src/pyverge/migration/walker.py" = ["C901", "PLR0912", "PLR0913"]
"src/pyverge/migration/types.py" = ["PLR0913"]
"src/pyverge/core/types.py" = ["PLR0913"]
"src/pyverge/types.py" = ["PLR0913"]
"src/pyverge/reflection/discovery.py" = ["C901", "PLR0912"]
"src/pyverge/ports/json_schema/adapter.py" = ["PLR0911"]
"tests/utils.py" = ["PLR0913"]
"tests/test_engine.py" = ["PLR0913"]
"tests/test_graph.py" = ["PLR0913"]
"tests/test_version_property.py" = ["PLR0913"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
format-jinja = "{% if distance == 0 %}{{ base }}{% else %}{{ serialize_pep440(base, stage, revision, dev=env.get('GITHUB_RUN_NUMBER', distance)) }}{% endif %}"
