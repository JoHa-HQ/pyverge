name: pyverge-faststream-showcase

services:
  # OpenTelemetry Collector — receives OTLP from the demo and forwards spans.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — the demo exports here
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  # Jaeger — trace storage + dashboard UI.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI — http://localhost:16686

  # Brokers — each under a profile; pick one, e.g. `--profile kafka`.
  kafka:
    image: confluentinc/cp-kafka:8.0.0
    profiles: [kafka]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  rabbitmq:
    image: rabbitmq:3.13-management
    profiles: [rabbitmq]
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI — http://localhost:15672

  nats:
    image: nats:2.10
    profiles: [nats]
    command: ["-js"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring — http://localhost:8222

  redis:
    image: redis:7
    profiles: [redis]
    ports:
      - "6379:6379"
