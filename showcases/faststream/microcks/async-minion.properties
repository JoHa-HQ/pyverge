# Async minion config for the docker-compose Quarkus profile.
%docker-compose.io.github.microcks.minion.async.client.MicrocksAPIConnector/mp-rest/url=http://microcks:8080
%docker-compose.quarkus.kafka.health.enabled=true
%docker-compose.kafka.bootstrap.servers=${MICROCKS_KAFKA_BOOTSTRAP_SERVER}
%docker-compose.mp.messaging.incoming.microcks-services-updates.enable.auto.commit=false
%docker-compose.mp.messaging.incoming.microcks-services-updates.bootstrap.servers=${MICROCKS_KAFKA_BOOTSTRAP_SERVER}
%docker-compose.mp.messaging.incoming.microcks-asyncapi-triggers.enable.auto.commit=false
%docker-compose.mp.messaging.incoming.microcks-asyncapi-triggers.bootstrap.servers=${MICROCKS_KAFKA_BOOTSTRAP_SERVER}
%docker-compose.minion.supported-bindings=${MICROCKS_BROKER_BINDING}
