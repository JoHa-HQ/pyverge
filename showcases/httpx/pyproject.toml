[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "anyio>=4.15.1",
  "pytest>=8.3"
]

[project]
name = "httpx-demo"
version = "0.0.0"
description = "httpx transport showcase for pyverge"
requires-python = ">=3.11"
dependencies = [
  "pyverge",
  "pyverge[httpx]",
  "httpx>=0.27"
]

[tool.hatch.build.targets.wheel]
packages = ["src/httpx_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.uv.sources]
pyverge = { path = "../../", editable = true }
