name: pyverge-fastmcp-showcase

services:
  # OpenTelemetry Collector — receives OTLP from the demo and forwards spans.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — the demo exports here
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  # Jaeger — trace storage + dashboard UI.
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger UI — http://localhost:16686
