[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24"
]

[project]
name = "fastmcp-demo"
version = "0.0.0"
description = "FastMCP + OpenTelemetry showcase for pyverge"
requires-python = ">=3.11"
dependencies = [
  "pyverge",
  "pyverge[fastmcp]",
  "dependency-injector>=4.48.2",
  "pydantic-settings>=2.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/fastmcp_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"

[tool.uv.sources]
pyverge = {path = "../../", editable = true}
