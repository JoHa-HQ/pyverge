repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: toml-sort
        name: toml sort
        entry: uv run toml-sort --in-place
        language: system
        types: [toml]
        exclude: (^|/)uv\.lock$
      - id: ty
        name: ty check
        entry: uv run ty check --exclude showcases/
        always_run: true
        language: system
        pass_filenames: false
        types: [python, pyi]
      - id: pydocstyle
        name: pydocstyle
        entry: uv run pydocstyle src/pyverge
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: pydoclint
        name: pydoclint
        entry: uv run pydoclint --quiet --style=google src/pyverge
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: docs-examples
        name: docs examples
        entry: uv run pytest --codeblocks docs/examples -q -o addopts=
        language: system
        pass_filenames: false
        files: ^docs/examples/.*\.md$
      - id: mkdocs-build
        name: mkdocs build
        entry: uv run mkdocs build --strict
        language: system
        pass_filenames: false
        files: ^(docs/|mkdocs\.yml$)
      - id: pytest
        name: pytest
        entry: uv run pytest -vv
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/errata-ai/vale
    rev: v3.25.1
    hooks:
      - id: vale
        files: ^docs/.*\.md$
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        files: ^docs/.*\.md$
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]
        types: [yaml]
        pass_filenames: true
ci:
  skip:
    - commitizen
