repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: toml-sort
        name: toml sort
        entry: uv run toml-sort --in-place
        language: system
        types: [toml]
      - id: ty
        name: ty check
        entry: uv run ty check
        always_run: true
        language: system
        pass_filenames: false
        types: [python, pyi]
      - id: pytest
        name: pytest
        entry: uv run pytest -vv
        language: system
        pass_filenames: false
        stages: [pre-push]
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        stages: [pre-commit]
ci:
  skip:
    - commitizen
