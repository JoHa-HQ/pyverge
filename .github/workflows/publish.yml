name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

env:
  UV_FROZEN: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --extra dev
      - run: uv run hatch build
      - name: Publish to GitHub Packages
        run: |
          uv publish \
            --index-url https://maven.pkg.github.com/${{ github.repository }} \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }}
