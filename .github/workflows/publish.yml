name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  UV_FROZEN: "1"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - run: uv build
      - name: Publish to GitHub Packages
        env:
          UV_PUBLISH_URL: https://maven.pkg.github.com/${{ github.repository }}
          UV_PUBLISH_USERNAME: ${{ github.actor }}
          UV_PUBLISH_PASSWORD: ${{ github.token }}
        run: uv publish dist/*
