name: Auto Tag

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - name: Extract ticket ID from commits
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Aborting."
            exit 1
          fi
          TICKET_ID=$(git log "$PREV_TAG"..HEAD --pretty=format:"%s" | grep -oE "#[0-9]+" | head -1)
          if [ -z "$TICKET_ID" ]; then
            echo "No ticket ID found in commits. Aborting."
            exit 1
          fi
          echo "TICKET_ID=$TICKET_ID" >> "$GITHUB_ENV"
          echo "ticket_id=$TICKET_ID"
      - name: Generate changelog
        run: uv run cz changelog
      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(${{ env.TICKET_ID }}): update CHANGELOG.md [skip ci]"
          file_pattern: CHANGELOG.md
      - name: Create version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=$(uv run cz bump --check-consistency --yes --dry-run | grep "tag to create:" | awk '{print $NF}')
          if [ -z "$VERSION" ]; then
            echo "No version bump detected. Aborting."
            exit 1
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        id: tag
      - name: Build package
        run: uv run hatch build
      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found. Aborting."
            exit 1
          fi
          uv run cz changelog --unreleased-version "${{ steps.tag.outputs.version }}" --start-rev "$PREV_TAG" > RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish to GitHub Packages
        run: |
          uv publish \
            --index-url https://maven.pkg.github.com/${{ github.repository }} \
            --username ${{ github.actor }} \
            --password ${{ github.token }}
        env:
          UV_PUBLISH_PASSWORD: ${{ github.token }}
