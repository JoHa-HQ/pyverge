name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      version: ${{ steps.plan.outputs.version }}
      ticket: ${{ steps.plan.outputs.ticket }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - name: Plan next release
        id: plan
        run: |
          CURRENT=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || echo "")
          NEXT=$(uv run cz bump --get-next --yes 2>/dev/null || true)
          NEXT=${NEXT#v}

          TICKET_ID=$(git log -1 --pretty=format:"%s" | grep -oE "#[0-9]+" | head -1 || true)

          if [ -z "$NEXT" ] || [ "$NEXT" = "$CURRENT" ]; then
            echo "No release-worthy changes."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$TICKET_ID" ]; then
            echo "No ticket ID found in latest commit." >&2
            exit 1
          fi

          {
            echo "should_release=true"
            echo "version=$NEXT"
            echo "ticket=$TICKET_ID"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release plan"
            echo
            echo "- Current: ${CURRENT:-none}"
            echo "- Next: $NEXT"
            echo "- Commit: $GITHUB_SHA"
            echo "- Ticket: $TICKET_ID"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          token: ${{ secrets.PUBLISHING_PAT }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - name: Tag planned release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          uv run cz bump "${{ needs.plan.outputs.version }}" \
            --yes \
            --changelog \
            --bump-message "chore(${{ needs.plan.outputs.ticket }}): release \$new_version [skip ci]"

          VERSION=$(git describe --tags --abbrev=0)
          if [ "$VERSION" != "v${{ needs.plan.outputs.version }}" ]; then
            echo "Planned version v${{ needs.plan.outputs.version }} != created tag $VERSION" >&2
            exit 1
          fi
          if git ls-remote --tags origin "$VERSION" | grep -q "$VERSION"; then
            echo "Tag $VERSION already exists on origin" >&2
            exit 1
          fi

          git push origin HEAD:main
          git push origin "$VERSION"
      - name: Build distribution
        run: uv build
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [plan, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  github-release:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ needs.plan.outputs.version }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Generate release notes
        run: uv run cz changelog "v${{ needs.plan.outputs.version }}" > RELEASE_NOTES.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHING_PAT }}
        run: |
          gh release create "v${{ needs.plan.outputs.version }}" \
            --title "Release v${{ needs.plan.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*
