name: Promote Release

on:
  workflow_dispatch:
    inputs:
      dev_tag:
        description: TestPyPI-validated dev tag (for example v0.14.1.dev40239661343)
        required: true
        type: string

concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyverge/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISHING_PAT }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - name: Preflight promotion
        id: preflight
        env:
          DEV_TAG: ${{ inputs.dev_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          if ! [[ "$DEV_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$ ]]; then
            echo "Expected a dev tag like v0.14.1.dev40239661343" >&2
            exit 1
          fi

          TAG_SHA=$(git rev-list -n1 "$DEV_TAG")
          MAIN_SHA=$(git rev-parse origin/main)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Dev tag $DEV_TAG is not the current main commit" >&2
            exit 1
          fi

          DEV_VERSION=${DEV_TAG#v}
          STABLE_VERSION=${DEV_VERSION%\.dev*}
          curl -fsS "https://test.pypi.org/pypi/pyverge/${DEV_VERSION}/json" >/dev/null

          LATEST_STABLE=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$LATEST_STABLE" ]; then
            echo "No stable tag found" >&2
            exit 1
          fi

          CHANGELOG_VERSION=$(grep -m1 '^## v' CHANGELOG.md \
            | sed -E 's/^## v([^ ]+).*/\1/')
          if [ "$CHANGELOG_VERSION" != "${LATEST_STABLE#v}" ]; then
            echo "CHANGELOG top ${CHANGELOG_VERSION} != latest stable tag ${LATEST_STABLE#v}" >&2
            exit 1
          fi

          PYPI_VERSION=$(curl -fsS https://pypi.org/pypi/pyverge/json \
            | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')
          if [ "$PYPI_VERSION" != "${LATEST_STABLE#v}" ]; then
            echo "PyPI ${PYPI_VERSION} != latest stable tag ${LATEST_STABLE#v}" >&2
            exit 1
          fi

          TICKET=$(git log --pretty=format:%s "${LATEST_STABLE}..${TAG_SHA}" \
            | grep -oE '#[0-9]+' | head -n1 || true)
          if [ -z "$TICKET" ]; then
            echo "No ticket id found in commits since ${LATEST_STABLE}" >&2
            exit 1
          fi

          {
            echo "source_sha=$TAG_SHA"
            echo "dev_version=$DEV_VERSION"
            echo "stable_version=$STABLE_VERSION"
            echo "ticket=$TICKET"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure main is unchanged
        env:
          SOURCE_SHA: ${{ steps.preflight.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$SOURCE_SHA" ]; then
            echo "main moved during promotion; rerun on a newer dev tag" >&2
            exit 1
          fi
      - name: Set release commit message
        env:
          TICKET: ${{ steps.preflight.outputs.ticket }}
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path

          import tomlkit

          path = Path("pyproject.toml")
          document = tomlkit.parse(path.read_text())
          commitizen = document["tool"]["commitizen"]
          commitizen["bump_message"] = (
              f"chore({os.environ['TICKET']}): release $new_version [skip ci]"
          )
          path.write_text(tomlkit.dumps(document))
          PY
      - name: Create release commit and tag
        uses: commitizen-tools/commitizen-action@338bbd841b75aaee6bf5340e1fa12f6ab58ff9ff # 0.27.1
        with:
          github_token: ${{ secrets.PUBLISHING_PAT }}
          push: true
          commit: true
          changelog: true
          manual_version: ${{ steps.preflight.outputs.stable_version }}
          git_name: github-actions[bot]
          git_email: github-actions[bot]@users.noreply.github.com
      - name: Restore pyproject
        run: git checkout -- pyproject.toml
      - name: Build distribution
        run: uv build
      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
      - name: Generate release notes
        env:
          VERSION: ${{ steps.preflight.outputs.stable_version }}
        run: uv run --no-sync cz changelog "v${VERSION}" > RELEASE_NOTES.md
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.preflight.outputs.stable_version }}
          name: Release v${{ steps.preflight.outputs.stable_version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
          token: ${{ secrets.PUBLISHING_PAT }}
