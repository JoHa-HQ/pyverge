name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  UV_FROZEN: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - run: uv run pre-commit run --all-files
      - name: Check conventional commits
        if: github.event_name == 'pull_request'
        run: |
          BASE=$(git merge-base origin/main HEAD)
          uv run cz check --rev-range "$BASE..HEAD"
      - name: Extract ticket ID from branch
        if: github.event_name == 'pull_request'
        env:
          branch: ${{ github.head_ref }}
        run: |
          TICKET_ID=$(echo "$branch" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          echo "TICKET_ID=$TICKET_ID" >> $GITHUB_ENV

      - name: Validate changelog (dry-run)
        if: github.event_name == 'pull_request'
        run: |
          uv run cz changelog --dry-run
  changelog:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
      - run: uv sync --group dev --all-extras
      - name: Generate changelog
        run: uv run cz changelog
      - name: Commit changelog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update CHANGELOG.md [skip ci]"
          file_pattern: CHANGELOG.md
