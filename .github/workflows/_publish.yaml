name: _Publish

on:
  workflow_call:
    inputs:
      index:
        description: Target package index (testpypi or pypi)
        required: true
        type: string
      environment:
        description: GitHub environment used for OIDC publishing
        required: true
        type: string
      ref:
        description: Git ref to build from (defaults to caller ref)
        required: false
        type: string
        default: ""
      version:
        description: Override package version (optional)
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - name: Resolve index URLs
        id: index
        env:
          INDEX: ${{ inputs.index }}
        run: |
          case "$INDEX" in
            testpypi)
              echo "publish-url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
              echo "check-url=https://test.pypi.org/simple/" >> "$GITHUB_OUTPUT"
              echo "simple-url=https://test.pypi.org/simple/" >> "$GITHUB_OUTPUT"
              ;;
            pypi)
              echo "publish-url=https://upload.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
              echo "check-url=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
              echo "simple-url=https://pypi.org/simple/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown index: $INDEX" >&2
              exit 1
              ;;
          esac
      - name: Build package
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PACKAGE_VERSION" ]; then
            export SETUPTOOLS_SCM_PRETEND_VERSION="$PACKAGE_VERSION"
          fi
          uv build --no-sources
      - name: Publish to ${{ inputs.index }}
        env:
          PUBLISH_URL: ${{ steps.index.outputs.publish-url }}
          CHECK_URL: ${{ steps.index.outputs.check-url }}
        run: |
          uv publish dist/* \
            --publish-url "$PUBLISH_URL" \
            --check-url "$CHECK_URL"
      - name: Verify install from ${{ inputs.index }}
        env:
          INDEX_SIMPLE_URL: ${{ steps.index.outputs.simple-url }}
        run: |
          uv run --no-project --prerelease allow \
            --with pyverge \
            --default-index "$INDEX_SIMPLE_URL" \
            --index https://pypi.org/simple/ \
            -- python -c "import pyverge; print('installed', pyverge.__version__)"
