name: Feature request
description: Propose a new feature or enhancement for pyverge
title: "[Feature]: <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve pyverge. Please search
        [existing issues](https://github.com/JoHa-HQ/pyverge/issues) and the
        [documentation](https://github.com/JoHa-HQ/pyverge/tree/main/docs) first.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: |
        What problem are you trying to solve? Why does it matter?
        What are you doing today instead?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like pyverge to do? Sketch the API or behavior.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing tools you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of pyverge does this touch?
      multiple: true
      options:
        - Core
        - Integrations
        - Adapters
        - CLI
        - Telemetry / hooks
        - Docs
        - Other
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example
      description: A short usage sketch of the proposed feature, if useful.
      render: python
    validations:
      required: false
